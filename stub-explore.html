<!doctype html>
<html><head><meta charset="utf-8"><title>explore harness</title>
<style>
  /* the exact rules from the JFF stylesheet that mangled the control icons */
  :where(img,svg,video,canvas,audio,iframe,embed,object){display:block}
  :where(svg){stroke:none;fill:currentColor}
  :where(svg):where(:not([width])){inline-size:5rem}
  button{background:0 0}
  svg{width:100%;height:100%}
  body{font:15px system-ui;background:#f7f7f5;color:#222;margin:0;padding:0 0 60px}
</style>
</head><body>
<header style="padding:14px;background:#fff">site header — untouched by the script</header>
<div id="movieApp" class="movie_page">
  <h2 class="movie_list__title">Film dan Video (classic listing — should be hidden)</h2>
  <div class="movie_list"><div class="movie_list__inner">classic cards…</div></div>
</div>

<script>
  // ---------- deterministic catalogue ----------
  const DAY = 86400000, H = 3600000;
  const iso = (ms) => new Date(ms).toISOString().slice(0, 19);
  const now = Date.now();

  function tile(code, label) {
    let hash = 0;
    for (let i = 0; i < code.length; i++) hash = (hash * 31 + code.charCodeAt(i)) % 360;
    const svg = '<svg xmlns="http://www.w3.org/2000/svg" width="272" height="408">' +
      '<defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1">' +
      '<stop offset="0" stop-color="hsl(' + hash + ',45%,26%)"/>' +
      '<stop offset="1" stop-color="hsl(' + ((hash + 40) % 360) + ',50%,14%)"/></linearGradient></defs>' +
      '<rect width="272" height="408" fill="url(#g)"/>' +
      '<text x="20" y="360" fill="#fff" font-family="system-ui" font-size="22" font-weight="700">' +
      label.replace(/[<>&]/g, '') + '</text></svg>';
    return 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
  }

  function mk(code, title, titleEn, opts) {
    opts = opts || {};
    const e = {
      contentsCode: code, contentsTitle: title, contentsTitleEn: titleEn,
      poster: opts.poster === null ? null : (opts.poster || tile(code, titleEn || title)),
      thumbnail: 'thumb-' + code + '.jpg',
      streamStart: iso(now + (opts.startOffset === undefined ? -10 * DAY : opts.startOffset)),
      streamEnd: iso(now + (opts.endOffset === undefined ? 30 * DAY : opts.endOffset)),
      detailUrl: '/movie/' + code.toLowerCase() + '/',
      youtubeLink: opts.yt || null,
      whiteLists: (opts.countries || ['id', 'sg', 'my']).map((c) => ({ country: c, ratingFlag: c === opts.ratedFor, message: c === opts.ratedFor ? 'C13' : null }))
    };
    const caps = opts.caps || ['en', 'id'];
    for (let i = 0; i < caps.length; i++) e['captionLange' + (i + 1)] = caps[i];
    return e;
  }

  window.__catalogue = [
    mk('D-LIVE1', 'ミックス。', 'MIXED DOUBLES', { endOffset: 5 * DAY, ratedFor: 'id' }),
    mk('D-LIVE2', 'ちはやふる', 'CHIHAYAFURU', {}),
    mk('D-LIVE3', '舟を編む', 'THE GREAT PASSAGE', { caps: ['en'], poster: 'does-not-exist.jpg' }),
    mk('D-LIVE4', 'そして父になる', 'LIKE FATHER, LIKE SON', { endOffset: 200 * DAY }),
    mk('D-LIVE5', '舞妓はレディ', 'LADY MAIKO', { countries: ['sg', 'my'] }),
    mk('D-LIVE6', '百円の恋', '100 YEN LOVE', { endOffset: 12 * DAY }),
    mk('D-YT1', 'JFF+ Independent Cinema', 'FREE ON YOUTUBE', { yt: 'https://www.youtube.com/watch?v=x', countries: [] }),
    mk('D-SOON1', 'キングダム', 'KINGDOM', { startOffset: 7 * DAY, endOffset: 60 * DAY, countries: ['id', 'sg'] }),
    mk('D-SOON2', 'るろうに剣心', 'RUROUNI KENSHIN', { startOffset: 20 * DAY, endOffset: 90 * DAY, countries: ['id'] }),
    mk('D-END1', '男はつらいよ', 'OTOKO WA TSURAI YO', { startOffset: -300 * DAY, endOffset: -2 * DAY, countries: ['id'] }),
    mk('D-END2', 'ゴジラ', 'GODZILLA', { startOffset: -400 * DAY, endOffset: -40 * DAY, countries: ['id'] }),
    mk('D-AFR', '【アフリカ限定】ちはやふる', 'AFRICA ONLY FILM', { countries: ['cm', 'bf'] })
  ];

  // resume positions: one live film half watched, one expired film, one youtube item
  localStorage.setItem('jff:theater:positions', JSON.stringify({
    '/movie/d-live1': { t: 2530, d: 7140, at: now - 2 * H },   // 42:10 of 1:59:00
    '/movie/d-live4': { t: 600, d: 7200, at: now - 30 * H },
    '/movie/d-end1':  { t: 300, d: 6000, at: now - 50 * H },
    '/movie/never-in-catalogue': { t: 100, d: 5000, at: now - 10 * H }
  }));

  // ---------- API mocks ----------
  window.__mock = { auth: 'id', catalogue: 'ok' };
  window.__fetchLog = [];
  const realFetch = window.fetch.bind(window);
  window.fetch = function (input, init) {
    const url = typeof input === 'string' ? input : (input && input.url) || '';
    if (url.indexOf('/jff-api/auth/me') === 0 || url.indexOf('/jff-api/auth/me') > -1) {
      window.__fetchLog.push('auth/me');
      if (window.__mock.auth === '401') return Promise.resolve(new Response('', { status: 401 }));
      return Promise.resolve(new Response(JSON.stringify({ data: { currentCountry: window.__mock.auth } }), { status: 200, headers: { 'Content-Type': 'application/json' } }));
    }
    if (url.indexOf('/jff-api/contents') > -1) {
      window.__fetchLog.push('contents');
      if (window.__mock.catalogue === 'fail') return Promise.resolve(new Response('', { status: 500 }));
      return Promise.resolve(new Response(JSON.stringify({ data: window.__catalogue }), { status: 200, headers: { 'Content-Type': 'application/json' } }));
    }
    return realFetch(input, init);
  };
</script>
</body></html>
